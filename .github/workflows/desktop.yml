name: Build Desktop (Windows, Linux, macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Desktop (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows Release
        working-directory: app
        run: flutter build windows --release --dart-define=APP_VERSION=1.1.1

      - name: Download & Bundle Desktop Core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/TeroVPN-v1.1.1-Windows-x64/core | Out-Null
          Copy-Item -Path "app/build/windows/x64/runner/Release/*" -Destination "dist/TeroVPN-v1.1.1-Windows-x64/" -Recurse -Force
          
          # Fetch matching core and tun service binaries
          Invoke-WebRequest -Uri "https://github.com/armanlife/firefox-vpn-client/releases/download/v1.0.5/Firefox-VPN-Windows-x64.zip" -OutFile "$env:TEMP/core-win.zip"
          Expand-Archive -Path "$env:TEMP/core-win.zip" -DestinationPath "$env:TEMP/core-win" -Force
          Copy-Item -Path "$env:TEMP/core-win/Firefox VPN/core/firefox-vpn-core.exe" -Destination "dist/TeroVPN-v1.1.1-Windows-x64/core/terovpn-core.exe" -Force
          Copy-Item -Path "$env:TEMP/core-win/Firefox VPN/core/firefox-vpn-tun.exe" -Destination "dist/TeroVPN-v1.1.1-Windows-x64/core/terovpn-tun.exe" -Force

          # Create portable flag file
          New-Item -ItemType File -Force "dist/TeroVPN-v1.1.1-Windows-x64/portable" | Out-Null

          # Compress to zip
          Compress-Archive -Path "dist/TeroVPN-v1.1.1-Windows-x64/*" -DestinationPath "dist/TeroVPN-v1.1.1-Windows-x64.zip" -Force

      - name: Build Windows Installer (Setup EXE)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/terovpn_setup.iss

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: TeroVPN-v1.1.1-Windows-Setup
          path: dist/TeroVPN-v1.1.1-Windows-Setup.exe

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: TeroVPN-v1.1.1-Windows-x64
          path: dist/TeroVPN-v1.1.1-Windows-x64.zip

  linux:
    name: Build Linux Desktop (x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev file

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux Release
        working-directory: app
        run: flutter build linux --release --dart-define=APP_VERSION=1.1.1

      - name: Download & Bundle Desktop Core
        run: |
          mkdir -p dist/TeroVPN-v1.1.1-Linux-x64/core
          cp -r app/build/linux/x64/release/bundle/* dist/TeroVPN-v1.1.1-Linux-x64/
          
          # Fetch matching Linux core and tun service binaries
          curl -sL "https://github.com/armanlife/firefox-vpn-client/releases/download/v1.0.5/Firefox-VPN-Linux-amd64.tar.gz" -o /tmp/core-linux.tar.gz
          mkdir -p /tmp/core-linux
          tar -xzf /tmp/core-linux.tar.gz -C /tmp/core-linux
          find /tmp/core-linux -type f -name "firefox-vpn-core" -exec cp {} dist/TeroVPN-v1.1.1-Linux-x64/core/terovpn-core \;
          find /tmp/core-linux -type f -name "firefox-vpn-tun" -exec cp {} dist/TeroVPN-v1.1.1-Linux-x64/core/terovpn-tun \;
          chmod +x dist/TeroVPN-v1.1.1-Linux-x64/core/* || true
          touch dist/TeroVPN-v1.1.1-Linux-x64/portable

          tar -czvf dist/TeroVPN-v1.1.1-Linux-x64.tar.gz -C dist TeroVPN-v1.1.1-Linux-x64

      - name: Build Linux AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy Flutter bundle and bundled core into AppDir/usr/bin
          cp -r dist/TeroVPN-v1.1.1-Linux-x64/* AppDir/usr/bin/
          
          # Copy desktop file and icons
          cp app/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png AppDir/terovpn.png
          cp app/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png AppDir/.DirIcon
          cp app/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png AppDir/usr/share/icons/hicolor/256x256/apps/terovpn.png
          
          cat << 'EOF' > AppDir/terovpn.desktop
[Desktop Entry]
Name=TeroVPN
Comment=Fast, Secure & Private VPN Client
Exec=terovpn %U
Icon=terovpn
Type=Application
Categories=Network;Security;VPN;
Terminal=false
StartupWMClass=terovpn
EOF
          cp AppDir/terovpn.desktop AppDir/usr/share/applications/
          
          cat << 'EOF' > AppDir/AppRun
#!/bin/sh
SELF=$(readlink -f "$0")
HERE=${SELF%/*}
export PATH="${HERE}/usr/bin:${PATH}"
export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${HERE}/usr/lib:${LD_LIBRARY_PATH}"
cd "${HERE}/usr/bin"
exec "${HERE}/usr/bin/terovpn" "$@"
EOF
          chmod +x AppDir/AppRun
          
          # Download official appimagetool
          curl -sLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Build AppImage with --appimage-extract-and-run to avoid requiring FUSE in CI
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream --appimage-extract-and-run AppDir dist/TeroVPN-v1.1.1-Linux-x64.AppImage
          chmod +x dist/TeroVPN-v1.1.1-Linux-x64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeroVPN-v1.1.1-Linux-AppImage
          path: dist/TeroVPN-v1.1.1-Linux-x64.AppImage

      - name: Upload Linux Tar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeroVPN-v1.1.1-Linux-Tar
          path: dist/TeroVPN-v1.1.1-Linux-x64.tar.gz

  macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build macOS Release
        working-directory: app
        run: flutter build macos --release --dart-define=APP_VERSION=1.1.1

      - name: Bundle Desktop Core, Resign & Archive
        run: |
          mkdir -p dist
          cp -r app/build/macos/Build/Products/Release/TeroVPN.app dist/

          # Fetch matching macOS core binary
          curl -sL "https://github.com/armanlife/firefox-vpn-client/releases/download/v1.0.5/Firefox-VPN-macOS.tar.gz" -o /tmp/core-macos.tar.gz
          mkdir -p /tmp/core-macos
          tar -xzf /tmp/core-macos.tar.gz -C /tmp/core-macos
          find /tmp/core-macos -type f -name "firefox-vpn-core" -exec cp {} dist/TeroVPN.app/Contents/MacOS/terovpn-core \; || true
          find /tmp/core-macos -type f -name "firefox-vpn-tun" -exec cp {} dist/TeroVPN.app/Contents/MacOS/terovpn-tun \; || true
          chmod +x dist/TeroVPN.app/Contents/MacOS/terovpn* || true

          # Strip quarantine attributes and re-sign bundle with ad-hoc signature to satisfy Gatekeeper
          xattr -cr dist/TeroVPN.app || true
          codesign --force --deep --sign - dist/TeroVPN.app || true

          # Create portable tar.gz
          tar -czvf dist/TeroVPN-v1.1.1-macOS.tar.gz -C dist TeroVPN.app

          # Create DMG image with Applications shortcut
          mkdir -p /tmp/dmg
          cp -r dist/TeroVPN.app /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create -volname "TeroVPN" -srcfolder /tmp/dmg -ov -format UDZO "dist/TeroVPN-v1.1.1-macOS.dmg"
          rm -rf /tmp/dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeroVPN-v1.1.1-macOS-DMG
          path: dist/TeroVPN-v1.1.1-macOS.dmg

      - name: Upload macOS Tar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeroVPN-v1.1.1-macOS-Tar
          path: dist/TeroVPN-v1.1.1-macOS.tar.gz

  release:
    name: Publish Release Assets
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.1.1"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "${{ github.repository }}" --title "TeroVPN $tag - Desktop & Android Edition" --notes "Desktop release for Windows (.exe installer & portable), macOS (.dmg & .tar.gz), and Linux (.AppImage & .tar.gz)."
          
          gh release upload "$tag" release-artifacts/* --repo "${{ github.repository }}" --clobber
