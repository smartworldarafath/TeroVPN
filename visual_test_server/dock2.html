<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Glassmorphic Navigation Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Responsive scale factor: 1 on desktop/tablet, scales down smoothly only on very small mobile screens */
      --bar-scale: 1;
      --spring-glide: cubic-bezier(0.22, 1.15, 0.32, 1);
      --jelly-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @media (max-width: 520px) {
      :root {
        --bar-scale: 0.76;
      }
    }

    @media (max-width: 390px) {
      :root {
        --bar-scale: 0.66;
      }
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      /* Exact dark deep violet-black background from screenshot corners */
      background-color: #110921;
      background-image: 
        radial-gradient(ellipse 680px 260px at 50% 50%, #261447 0%, #140a28 52%, #0c0519 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(var(--bar-scale));
      transform-origin: center center;
    }

    /* Outer Purple Ambient Halo around the Pill */
    .outer-ambient-glow {
      position: absolute;
      width: 490px;
      height: 120px;
      border-radius: 9999px;
      background: radial-gradient(
        ellipse at 50% 50%,
        rgba(90, 48, 175, 0.42) 0%,
        rgba(60, 24, 120, 0.22) 55%,
        transparent 75%
      );
      filter: blur(16px);
      pointer-events: none;
      z-index: 1;
    }

    /* Main Outer Pill Container (Exact 464px x 97px) */
    .nav-pill {
      position: relative;
      z-index: 10;
      width: 464px;
      height: 97px;
      border-radius: 9999px;
      /* Deep obsidian-violet glass surface */
      background: linear-gradient(
        180deg,
        rgba(30, 24, 46, 0.86) 0%,
        rgba(18, 13, 30, 0.92) 50%,
        rgba(24, 18, 38, 0.88) 100%
      );
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      /* Natural 3D glass edge rim & ambient drop shadow */
      box-shadow:
        0 24px 44px -8px rgba(3, 1, 8, 0.75),
        0 4px 24px 0 rgba(76, 32, 160, 0.25),
        /* Subtle natural outer glass rim without corner flare blobs */
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1.5px 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12),
        inset 0 12px 24px -6px rgba(10, 6, 20, 0.6);
      display: grid;
      grid-template-columns: repeat(4, 98px);
      justify-content: center;
      align-items: center;
      padding: 0 36px;
      overflow: visible;
    }

    /* Subtle top glass highlight across the upper half of the bar */
    .nav-pill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 46%;
      border-radius: 9999px 9999px 50px 50px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.11) 0%,
        rgba(255, 255, 255, 0.02) 60%,
        transparent 100%
      );
      pointer-events: none;
    }

    /* Sliding Active Indicator Assembly (98px slot width) */
    .active-slot-slider {
      position: absolute;
      top: 8.5px;
      left: 36px;
      width: 98px;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 25;
      pointer-events: none;
      touch-action: none;
      transition: transform 0.48s var(--spring-glide);
      will-change: transform;
    }

    .active-slot-slider.is-dragging {
      transition: none !important;
    }

    /* Outer Tray: Idle state (Matches reference image) */
    .active-tray {
      position: relative;
      width: 92px;
      height: 80px;
      border-radius: 21px;
      background: linear-gradient(
        180deg,
        rgba(82, 68, 126, 0.45) 0%,
        rgba(48, 38, 80, 0.38) 52%,
        rgba(72, 58, 112, 0.52) 100%
      );
      box-shadow:
        0 8px 18px -3px rgba(4, 2, 12, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.18),
        inset 0 1.25px 1px 0 rgba(255, 255, 255, 0.38),
        inset 0 -1.5px 2px 0 rgba(245, 235, 255, 0.35),
        inset 0 -10px 18px -4px rgba(150, 115, 235, 0.32);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      display: flex;
      justify-content: center;
      padding-top: 5.5px;
      transition: all 0.38s cubic-bezier(0.18, 0.9, 0.28, 1.3);
      will-change: transform, width, height, border-radius;
    }

    /* 3D Glossy Purple Jelly Capsule (78px x 42px) */
    .purple-capsule {
      position: relative;
      width: 78px;
      height: 42px;
      border-radius: 9999px;
      background: radial-gradient(ellipse 75% 65% at 50% 35%, #7038e8 0%, #511ec4 42%, #350f96 78%, #200460 100%);
      box-shadow:
        0 8px 16px -2px rgba(8, 2, 24, 0.75),
        0 0 18px 2px rgba(120, 56, 245, 0.45),
        0 0 0 1px rgba(220, 195, 255, 0.4),
        inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.8),
        inset 0 -2.5px 4px 0 rgba(200, 160, 255, 0.7),
        inset 9px 0 12px -4px rgba(18, 2, 54, 0.8),
        inset -9px 0 12px -4px rgba(18, 2, 54, 0.8);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.18, 0.9, 0.28, 1.3);
      will-change: transform, width, height, border-radius, background;
    }

    /* ===== LIQUID GLASS LENS =====
       Transparent glass that sits ABOVE the bar (sibling of the nav, so it can see the
       bar + page behind it). The rim bends what is behind it (refraction) so the bar edge
       flares into the lens corners, exactly like the reference. */
    .lens-slider {
      position: absolute;
      top: 8.5px;
      left: 36px;
      width: 98px;
      height: 80px;
      z-index: 40;
      pointer-events: none;
      transition: transform 0.48s var(--spring-glide);
      will-change: transform;
    }
    .nav-pill.is-holding + .lens-slider { transition: none; }

    /* Outer shadow lives on its own element: shadows on the .lens itself stretch the refraction map */
    .lens-shadow {
      position: absolute;
      left: calc(50% - 71px);
      top: calc(50% - 65px);
      width: 142px;
      height: 130px;
      border-radius: 36px;
      opacity: 0;
      transform: scale(0.72);
      transition: opacity 0.28s ease, transform 0.46s var(--jelly-bounce);
      box-shadow:
        0 20px 34px -10px rgba(0, 0, 0, 0.6),
        0 0 28px 0 rgba(110, 70, 220, 0.20);
    }
    .nav-pill.is-holding + .lens-slider .lens-shadow {
      opacity: 1;
      transform: scale(1);
    }

    .lens {
      position: absolute;
      left: calc(50% - 71px);
      top: calc(50% - 65px);
      width: 142px;
      height: 130px;
      border-radius: 36px;
      opacity: 0;
      transform: scale(0.72);
      transition: opacity 0.28s ease, transform 0.46s var(--jelly-bounce);
      /* fallback first, refraction second (browsers without url() backdrop support keep the fallback) */
      -webkit-backdrop-filter: blur(0.6px) brightness(1.12) saturate(1.2);
      backdrop-filter: blur(0.6px) brightness(1.12) saturate(1.2);
      -webkit-backdrop-filter: url(#lensRefract) brightness(1.12) saturate(1.2);
      backdrop-filter: url(#lensRefract) brightness(1.12) saturate(1.2);
      background:
        linear-gradient(180deg, rgba(8, 4, 20, 0.16) 0%, rgba(8, 4, 20, 0) 38%, rgba(255, 255, 255, 0.06) 100%);
      box-shadow:
        inset 0 0 0 1.2px rgba(255, 255, 255, 0.42),
        inset 0 1.6px 1px 0 rgba(255, 255, 255, 0.85),
        inset 0 -1.4px 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 0 16px 1px rgba(255, 255, 255, 0.12);
    }
    .nav-pill.is-holding + .lens-slider .lens {
      opacity: 1;
      transform: scale(1);
    }

    /* HOLD STATE: the flat tray steps aside, the jelly capsule stays visible UNDER the glass */
    .nav-pill.is-holding .active-tray {
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .nav-pill.is-holding .purple-capsule {
      width: 86px;
      height: 48px;
      transform: translateY(-2px);
      box-shadow:
        0 12px 24px -2px rgba(10, 2, 32, 0.9),
        0 0 30px 6px rgba(150, 85, 255, 0.55),
        inset 0 2px 3px 0 rgba(255, 255, 255, 0.95),
        inset 0 -3px 5px 0 rgba(230, 200, 255, 0.85);
    }

    /* Glossy Top-Half Glass Reflection Dome inside Purple Capsule */
    .purple-capsule::before {
      content: '';
      position: absolute;
      top: 1.5px;
      left: 6px;
      right: 6px;
      height: 19px;
      border-radius: 9999px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.6) 0%,
        rgba(240, 225, 255, 0.25) 45%,
        rgba(175, 130, 255, 0.0) 100%
      );
      pointer-events: none;
    }

    /* Left & Right Inner Crescent Rim Highlights inside Purple Capsule (Exact match to photo) */
    .purple-capsule::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 9999px;
      box-shadow:
        inset 3.5px 0 4.5px -1.5px rgba(240, 225, 255, 0.72),
        inset -3.5px 0 4.5px -1.5px rgba(240, 225, 255, 0.72);
      pointer-events: none;
    }

    /* Subtle liquid stretch when sliding between tabs */
    .active-slot-slider.gliding .active-tray {
      transform: scaleX(1.045) scaleY(0.965);
    }
    .active-slot-slider.gliding .purple-capsule {
      transform: scaleX(1.075) scaleY(0.93);
    }

    /* Navigation Button Item (98px wide x 80px high) */
    .nav-item {
      position: relative;
      z-index: 30;
      width: 98px;
      height: 80px;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: none;
    }

    /* Icon Wrapper positioned at exact vertical center of the Purple Capsule */
    .icon-wrap {
      margin-top: 13px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: transform 0.38s var(--jelly-bounce);
    }

    .nav-pill.is-holding .nav-item.active .icon-wrap {
      transform: scale(1.12) translateY(-2px);
    }

    .nav-pill.is-holding .nav-item.active .nav-text {
      transform: translateY(2px) scale(1.04);
      color: #ffffff;
      text-shadow: 0 0 12px rgba(225, 200, 255, 0.8);
    }

    .nav-item:not(.active):hover .icon-wrap {
      transform: translateY(-1.5px);
    }

    .nav-svg {
      width: 25px;
      height: 25px;
      overflow: visible;
      transition: filter 0.35s ease, transform 0.42s var(--jelly-bounce);
    }

    .nav-item:not(.active) .nav-svg {
      filter: drop-shadow(0 1.5px 2px rgba(0, 0, 0, 0.55));
    }

    .nav-item.active .nav-svg {
      filter: 
        drop-shadow(0 1.5px 3px rgba(16, 3, 48, 0.7))
        drop-shadow(0 0 6px rgba(225, 210, 255, 0.35));
    }

    /* Smooth crossfade between inactive metallic icon and active luminous icon */
    .icon-inactive {
      opacity: 1;
      transform: scale(1);
      transform-origin: center;
      transition: opacity 0.28s ease, transform 0.38s var(--jelly-bounce);
    }

    .icon-active {
      opacity: 0;
      transform: scale(0.84);
      transform-origin: center;
      transition: opacity 0.28s ease, transform 0.38s var(--jelly-bounce);
    }

    .nav-item.active .icon-inactive {
      opacity: 0;
      transform: scale(0.84);
    }

    .nav-item.active .icon-active {
      opacity: 1;
      transform: scale(1);
    }

    /* Text Label positioned at exact lower section of the bar */
    .nav-text {
      margin-top: 14px;
      font-size: 13.5px;
      line-height: 1;
      letter-spacing: -0.01em;
      font-weight: 500;
      color: #8f8a9e;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.35s ease;
    }

    .nav-item:not(.active):hover .nav-text {
      color: #b5b0c4;
    }

    .nav-item.active .nav-text {
      color: #ebe6f6;
      text-shadow: 
        0 1px 3px rgba(0, 0, 0, 0.75),
        0 0 8px rgba(215, 195, 255, 0.25);
    }

    /* Hold: white glowing icon + pure white label (photo look) */
    .nav-pill.is-holding .nav-item.active .nav-svg {
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 12px rgba(255, 255, 255, 0.55));
    }
    .nav-pill.is-holding .nav-item.active .nav-text {
      color: #ffffff;
      text-shadow: 0 0 1px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>

  <!-- SVG Gradients & Cutout Masks -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- Inactive Brushed Silver-Grey Gradient matching Home, Profiles, Settings -->
      <linearGradient id="inactiveSilver" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#c9c5d6" />
        <stop offset="55%" stop-color="#9e99ad" />
        <stop offset="100%" stop-color="#807b90" />
      </linearGradient>

      <!-- Active Soft Lavender-White Gradient matching the Globe inside the Purple Pill -->
      <linearGradient id="activeLavender" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f7f4ff" />
        <stop offset="55%" stop-color="#dfd4f7" />
        <stop offset="100%" stop-color="#c6b5eb" />
      </linearGradient>

      <!-- Exact Cutout Mask for the Countries Globe Icon -->
      <mask id="exactGlobeMask">
        <rect x="0" y="0" width="26" height="26" fill="white" />
        <!-- North & South America dark purple negative-space landmass matching reference image -->
        <path d="M 12.6 4.1
                 C 10.7 4.7, 8.9 6.2, 8.8 7.9
                 C 8.7 9.5, 11.3 10.6, 13.8 10.4
                 C 15.1 10.3, 15.8 11.3, 15.3 12.8
                 C 14.6 14.5, 12.2 15.8, 12.6 18.3
                 C 12.9 19.9, 14.6 21.3, 16.8 21.1

  <script>
    const navPill = document.querySelector('.nav-pill');
    const navItems = document.querySelectorAll('.nav-item');
    const activeSlider = document.getElementById('activeSlider');
    const lensSlider = document.getElementById('lensSlider');
    function moveSliders(x) {
      const t = `translateX(${x}px)`;
      activeSlider.style.transform = t;
      lensSlider.style.transform = t;
    }
    const tray = activeSlider.querySelector('.active-tray');
    const purpleCapsule = activeSlider.querySelector('.purple-capsule');
    const SLOT_WIDTH = 98; // Exact pixel width per tab slot
    const TOTAL_TABS = 4;
    const MIN_X = 0;
    const MAX_X = (TOTAL_TABS - 1) * SLOT_WIDTH;

    let currentTab = 1;
    let isHolding = false;
    let isDragging = false;
    let startPointerX = 0;
    let currentX = currentTab * SLOT_WIDTH;
    let dragOffset = 0;
    let velocity = 0;
    let lastDragTime = 0;
    let lastX = 0;
    let glideTimer = null;
    let holdTimeout = null;

    function updateActiveItems(activeIndex) {
      navItems.forEach((item, i) => {
        item.classList.toggle('active', i === activeIndex);
      });
    }

    function selectTab(index, animate = true) {
      currentTab = Math.max(0, Math.min(TOTAL_TABS - 1, index));
      currentX = currentTab * SLOT_WIDTH;

      updateActiveItems(currentTab);

      if (animate) {
        activeSlider.classList.remove('is-dragging');
        activeSlider.classList.add('gliding');
        clearTimeout(glideTimer);
        glideTimer = setTimeout(() => {
          activeSlider.classList.remove('gliding');
        }, 320);
      }

      moveSliders(currentX);
    }

    // Direct pointer tracking on navPill so ANY hold / drag starts seamlessly
    navPill.addEventListener('pointerdown', (e) => {
      // Find which slot was tapped
      const rect = navPill.getBoundingClientRect();
      const clickX = e.clientX - rect.left - 36; // minus padding
      const tappedSlot = Math.max(0, Math.min(TOTAL_TABS - 1, Math.floor(clickX / SLOT_WIDTH)));

      startPointerX = e.clientX;
      lastX = currentX;
      lastDragTime = performance.now();
      velocity = 0;
      isDragging = false;
      dragOffset = 0;

      // Enter HOLD state immediately on press
      isHolding = true;
      navPill.classList.add('is-holding');
      activeSlider.classList.add('is-dragging');

      // Set pointer capture to pill
      navPill.setPointerCapture?.(e.pointerId);

      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    });

    function onPointerMove(e) {
      if (!isHolding) return;
      e.preventDefault();

      const deltaX = e.clientX - startPointerX;

      // Start dragging once threshold passed
      if (Math.abs(deltaX) > 4) {
        isDragging = true;
      }

      const now = performance.now();
      const dt = Math.max(1, now - lastDragTime);

      let nextX = (currentTab * SLOT_WIDTH) + deltaX;

      // Rubber-band resistance at edges
      if (nextX < MIN_X) {
        nextX = MIN_X - Math.pow(MIN_X - nextX, 0.72) * 2.2;
      } else if (nextX > MAX_X) {
        nextX = MAX_X + Math.pow(nextX - MAX_X, 0.72) * 2.2;
      }

      velocity = (nextX - lastX) / dt;
      lastDragTime = now;
      lastX = nextX;
      currentX = nextX;

      // Liquid stretch and lean matching the GIF
      const leanX = Math.max(-10, Math.min(10, velocity * 6));
      const stretch = 1 + Math.min(0.2, Math.abs(velocity) * 0.08);
      const compress = 1 / stretch;

      moveSliders(nextX);
      tray.style.transform = `scale(${stretch * 1.05}, ${compress * 1.02}) skewX(${-leanX}deg)`;
      purpleCapsule.style.transform = `scale(${stretch * 1.06}, ${compress}) skewX(${-leanX * 0.6}deg) translateY(-2px)`;

      // Dynamically highlight closest tab under the glass bubble
      const hoveredIndex = Math.max(0, Math.min(TOTAL_TABS - 1, Math.round(nextX / SLOT_WIDTH)));
      updateActiveItems(hoveredIndex);
    }

    function onPointerUp(e) {
      if (!isHolding) return;
      
      const wasDragging = isDragging;
      isHolding = false;
      isDragging = false;

      navPill.classList.remove('is-holding');
      activeSlider.classList.remove('is-dragging');
      tray.style.transform = '';
      purpleCapsule.style.transform = '';

      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);

      if (wasDragging) {
        // Flick momentum
        const projectedX = currentX + velocity * 90;
        let targetIndex = Math.round(projectedX / SLOT_WIDTH);
        targetIndex = Math.max(0, Math.min(TOTAL_TABS - 1, targetIndex));
        selectTab(targetIndex, true);
      } else {
        // Quick tap: select the tab that was clicked
        const rect = navPill.getBoundingClientRect();
        const clickX = e.clientX - rect.left - 36;
        const tappedSlot = Math.max(0, Math.min(TOTAL_TABS - 1, Math.floor(clickX / SLOT_WIDTH)));
        selectTab(tappedSlot, true);
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        selectTab((currentTab + 1) % TOTAL_TABS);
      } else if (e.key === 'ArrowLeft') {
        selectTab((currentTab - 1 + TOTAL_TABS) % TOTAL_TABS);
      }
    });

    // Initial setup
    selectTab(1, false);
  </script>
