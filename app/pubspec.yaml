publish_to: 'none'

version: 1.2.0+20

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: ^0.19.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  mobile_scanner: ^7.4.3
