  <g clip-path="url(#clip_badge_license_light)">
    <!-- Frosted transparent glass base + optical color refraction -->
    <rect x="0.5" y="0.5" width="146" height="33" rx="16.5" fill="url(#glass_badge_license_light)"/>
    <rect x="0.5" y="0.5" width="146" height="33" rx="16.5" fill="url(#refract_badge_license_light)"/>
    <!-- Curved top specular lens reflection (iOS 26 signature upper sheen) -->
    <ellipse cx="73.5" cy="2.0" rx="67.6" ry="9.5" fill="#FFFFFF" fill-opacity="0.16"/>
    <!-- Nested frosted glass value pill -->
    <g clip-path="url(#pclip_badge_license_light)">
