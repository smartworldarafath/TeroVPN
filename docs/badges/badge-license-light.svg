    <rect x="0.9" y="0.9" width="145.2" height="32.2" rx="16.1" fill="none" stroke="url(#spec_badge_license_light)" stroke-width="1.1"/>
    <line x1="11.1" y1="1.1" x2="135.9" y2="1.1" stroke="url(#topglint_badge_license_light)" stroke-width="1.1"/>
  </g>
