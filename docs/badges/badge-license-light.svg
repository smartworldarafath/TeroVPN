    </g>
    <!-- Gentle iOS glass light sweep -->
    <rect x="-75" y="0" width="58" height="34" fill="url(#sh_badge_license_light)" transform="skewX(-22)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="297 0" dur="5.6s" repeatCount="indefinite"/>
    </rect>
    <!-- Chromatic dispersion & 45-deg Apple specular bevel -->
