    <clipPath id="pclip_badge_extension_light"><rect x="132.8" y="3.5" width="93.2" height="27.0" rx="13.5"/></clipPath>
    <linearGradient id="glass_badge_extension_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#EEF2FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.62"/>
    </linearGradient>
    <radialGradient id="refract_badge_extension_light" cx="78%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0.04"/>
    </radialGradient>
    <linearGradient id="spec_badge_extension_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#CBD5E1" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="chrom_badge_extension_light" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#4285F4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="pill_badge_extension_light" x1="0" y1="0" x2="0" y2="1">
