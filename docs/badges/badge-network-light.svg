    <clipPath id="pclip_badge_network_light"><rect x="83.9" y="3.5" width="139.0" height="27.0" rx="13.5"/></clipPath>
    <linearGradient id="glass_badge_network_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#EEF2FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.62"/>
    </linearGradient>
    <radialGradient id="refract_badge_network_light" cx="78%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.04"/>
    </radialGradient>
    <linearGradient id="spec_badge_network_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#CBD5E1" stop-opacity="0.38"/>
