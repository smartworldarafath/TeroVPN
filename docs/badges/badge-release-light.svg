  <defs>
    <clipPath id="clip_badge_release_light"><rect x="0.5" y="0.5" width="138" height="33" rx="16.5"/></clipPath>
    <clipPath id="pclip_badge_release_light"><rect x="78.6" y="3.5" width="56.2" height="27.0" rx="13.5"/></clipPath>
    <linearGradient id="glass_badge_release_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#EEF2FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.62"/>
    </linearGradient>
    <radialGradient id="refract_badge_release_light" cx="78%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#6B42FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6B42FF" stop-opacity="0.04"/>
    </radialGradient>
    <linearGradient id="spec_badge_release_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#CBD5E1" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="chrom_badge_release_light" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#6B42FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="pill_badge_release_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B42FF" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#6B42FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6B42FF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="topglint_badge_release_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="78%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh_badge_release_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
